<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로컬 스케줄러</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⏱</span>
      <div>
        <h1>로컬 스케줄러</h1>
        <p class="sub" id="subtitle">작업을 불러오는 중…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="conn" id="conn" title="서버 연결 상태"><i></i><span>연결됨</span></span>
      <button class="btn primary" id="btn-new">＋ 새 작업</button>
    </div>
  </header>

  <main>
    <div id="empty" class="empty hidden">
      <h2>아직 등록된 작업이 없습니다</h2>
      <p>Claude Code 프롬프트나 셸 명령을 정해진 시각에 자동으로 실행할 수 있습니다.</p>
      <button class="btn primary" id="btn-new-empty">첫 작업 만들기</button>
    </div>
    <div id="job-list" class="job-list"></div>
  </main>

  <!-- 작업 편집 패널 -->
  <div class="overlay hidden" id="editor-overlay">
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <header class="panel-head">
        <h2 id="editor-title">새 작업</h2>
        <button class="icon-btn" id="editor-close" aria-label="닫기">✕</button>
      </header>

      <div class="panel-body">
        <label class="field">
          <span>작업 이름</span>
          <input type="text" id="f-name" placeholder="예: 매일 아침 KB 활동 수집" autocomplete="off" />
        </label>

        <div class="field">
          <span>실행 종류</span>
          <div class="segmented" id="f-type">
            <button type="button" data-type="claude" class="active">Claude Code</button>
            <button type="button" data-type="shell">셸 명령</button>
          </div>
        </div>

        <div id="claude-fields">
          <label class="field">
            <span>프롬프트</span>
            <textarea id="f-prompt" rows="6" placeholder="Claude Code에 보낼 지시문을 입력하세요.&#10;예) /kb-daily 를 실행해서 어제 활동을 수집하고 요약해줘"></textarea>
            <small>비대화형(<code>-p</code>)으로 실행되며, 프롬프트는 표준입력으로 전달되어 따옴표·줄바꿈이 깨지지 않습니다.</small>
          </label>

          <div class="row">
            <label class="field">
              <span>모델 <em>(선택)</em></span>
              <input type="text" id="f-model" list="model-list" placeholder="비워두면 Claude Code 기본 모델" autocomplete="off" />
              <datalist id="model-list"></datalist>
              <small>목록에서 고르거나 직접 입력합니다. <code>opus</code> 같은 별칭은 항상 그 계열 최신 모델을 가리킵니다.</small>
            </label>
            <label class="field">
              <span>권한 모드</span>
              <select id="f-permission"></select>
            </label>
          </div>
          <p class="warn hidden" id="permission-warn">
            <strong>bypassPermissions</strong>는 모든 도구 사용을 확인 없이 허용합니다. 무인 실행에는 편리하지만, 신뢰할 수 있는 프롬프트에만 사용하세요.
          </p>

          <details class="advanced">
            <summary>고급 옵션</summary>
            <label class="field">
              <span>허용 도구 <em>(--allowedTools)</em></span>
              <input type="text" id="f-tools" placeholder='예: "Bash(git:*)" "Read" "Edit"' autocomplete="off" />
            </label>
            <label class="field">
              <span>추가 인자</span>
              <input type="text" id="f-extra" placeholder="예: --add-dir C:\ai\datahub" autocomplete="off" />
            </label>
          </details>
        </div>

        <div id="shell-fields" class="hidden">
          <label class="field">
            <span>실행할 명령</span>
            <textarea id="f-command" rows="4" placeholder="예: node C:\ai\scripts\backup.js"></textarea>
            <small>Windows에서는 <code>cmd.exe</code>, macOS·Linux에서는 <code>/bin/sh</code> 로 실행됩니다.</small>
          </label>
        </div>

        <label class="field">
          <span>작업 디렉토리 <em>(선택)</em></span>
          <input type="text" id="f-cwd" placeholder="예: C:\ai\datahub — 비워두면 홈 디렉토리" autocomplete="off" spellcheck="false" />
          <small>절대경로로 씁니다. <code>~/ai/datahub</code> 처럼 <code>~</code> 로 시작하면 두 PC의 각자 홈 기준으로 풀립니다.</small>
        </label>

        <label class="field">
          <span>macOS에서의 경로 <em>(선택 — 두 PC 동기화용)</em></span>
          <input type="text" id="f-cwd-mac" placeholder="예: /Users/이름/ai/datahub — 비우면 위 경로를 그대로 사용" autocomplete="off" spellcheck="false" />
        </label>

        <p class="warn hidden" id="cwd-warn"></p>

        <div class="field">
          <span>스케줄</span>
          <select id="f-preset">
            <option value="">프리셋에서 고르기…</option>
          </select>
          <div class="cron-row">
            <input type="text" id="f-schedule" placeholder="0 9 * * 1-5" autocomplete="off" spellcheck="false" />
            <span class="cron-hint">분 시 일 월 요일</span>
          </div>
          <div class="preview" id="schedule-preview"></div>
        </div>

        <div class="row">
          <label class="field">
            <span>타임아웃 (분)</span>
            <input type="number" id="f-timeout" min="1" max="720" step="1" value="30" />
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="f-catchup" />
            <span>놓친 일정 보정<em>PC가 꺼져 있어 건너뛴 일정을 재시작 후 1회 실행합니다</em></span>
          </label>
        </div>

        <label class="field">
          <span>메모 <em>(선택)</em></span>
          <input type="text" id="f-notes" placeholder="이 작업의 목적을 적어두면 나중에 알아보기 좋습니다" autocomplete="off" />
        </label>

        <p class="error hidden" id="editor-error"></p>
      </div>

      <footer class="panel-foot">
        <button class="btn ghost danger" id="btn-delete">삭제</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="btn-cancel">취소</button>
        <button class="btn primary" id="btn-save">저장</button>
      </footer>
    </section>
  </div>

  <!-- 실행 이력 / 로그 -->
  <div class="overlay hidden" id="logs-overlay">
    <section class="panel wide" role="dialog" aria-modal="true" aria-labelledby="logs-title">
      <header class="panel-head">
        <h2 id="logs-title">실행 이력</h2>
        <button class="icon-btn" id="logs-close" aria-label="닫기">✕</button>
      </header>
      <div class="logs-body">
        <aside class="run-list" id="run-list"></aside>
        <div class="log-view">
          <div class="log-meta" id="log-meta"></div>
          <pre id="log-text">실행 이력을 선택하세요.</pre>
        </div>
      </div>
    </section>
  </div>

  <div class="toast-stack" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
